apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stockflow-backend
  template:
    metadata:
      labels:
        app: stockflow-backend
    spec:
      containers:
      - name: backend
        image: 066119770559.dkr.ecr.us-east-1.amazonaws.com/cloud-stockflow-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stockflow-backend-service
spec:
  type: NodePort
  selector:
    app: stockflow-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001