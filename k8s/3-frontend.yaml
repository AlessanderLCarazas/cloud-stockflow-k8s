apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockflow-frontend
  template:
    metadata:
      labels:
        app: stockflow-frontend
    spec:
      containers:
      - name: frontend
        image: 066119770559.dkr.ecr.us-east-1.amazonaws.com/cloud-stockflow-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: stockflow-frontend-service
spec:
  type: NodePort
  selector:
    app: stockflow-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080