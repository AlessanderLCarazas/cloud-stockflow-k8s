name: Verificar CloudWatch

on:
  push:
    branches: [Princce]
    paths:
      - ".github/workflows/verificar-cloudwatch.yml"

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-22.04

    steps:
      - name: Conectar con AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Comprobar acceso a CloudWatch
        run: |
          aws sts get-caller-identity > /dev/null
          aws cloudwatch get-metric-statistics \
          --namespace AWS/EC2 \
          --metric-name CPUUtilization \
          --dimensions Name=InstanceId,Value=i-0344c3384600f5927 \
          --start-time "$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)" \
          --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --period 300 \
          --statistics Average \
          --output table
          echo "Conexion a AWS y permiso CloudWatch correctos"